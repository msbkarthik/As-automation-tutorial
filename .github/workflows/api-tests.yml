name: API tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run the API in background
        run: setsid npm start > api.log 2>&1 < /dev/null &

      - name: Wait until the API is running
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthcheck; then
              echo "API is running"
              exit 0
            fi
            sleep 1
          done
          echo "API did not respond on /healthcheck"
          cat api.log || true
          exit 1

      - name: Run the tests
        run: npm test
