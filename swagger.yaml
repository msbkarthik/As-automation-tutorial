openapi: 3.0.3
info:
  title: E-commerce REST API
  version: 1.0.0
  description: |
    In-memory e-commerce API. Consumers register or log in to receive a JWT,
    then check out with cash (10% discount) or credit card.
servers:
  - url: http://localhost:3000
paths:
  /register:
    post:
      summary: Register a user
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Dave Miller
              email: dave@example.com
              password: password123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:
      summary: Login and receive a JWT
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: password123
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /checkout:
    post:
      summary: Checkout the cart
      description: |
        Requires a Bearer token. Accepted payment methods are `cash` and `credit_card`.
        Cash applies a 10% discount on the subtotal. Credit card applies no discount.
      operationId: checkout
      tags:
        - Checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              items:
                - productId: 1
                  quantity: 1
              paymentMethod: cash
      responses:
        '200':
          description: Checkout completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid payment method, items, or product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthcheck:
    get:
      summary: Health check
      operationId: healthcheck
      tags:
        - Health
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /api-docs:
    get:
      summary: Render the Swagger UI
      operationId: apiDocs
      tags:
        - Docs
      responses:
        '200':
          description: Swagger UI HTML
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    CheckoutItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
    CheckoutRequest:
      type: object
      required:
        - items
        - paymentMethod
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItem'
        paymentMethod:
          type: string
          enum:
            - cash
            - credit_card
    CheckoutLine:
      type: object
      properties:
        productId:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
    CheckoutResponse:
      type: object
      properties:
        paymentMethod:
          type: string
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLine'
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      properties:
        message:
          type: string
